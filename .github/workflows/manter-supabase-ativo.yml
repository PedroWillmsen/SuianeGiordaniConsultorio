# O plano grátis do Supabase pausa o projeto após 7 dias sem uso.
# Esta tarefa faz uma consulta simples a cada 2 dias para mantê-lo sempre ativo.
name: Manter Supabase ativo

on:
  schedule:
    - cron: "0 11 */2 * *"   # a cada 2 dias, 8h no horário de Brasília
  workflow_dispatch:          # permite rodar manualmente pela aba Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar o banco
        env:
          URL: https://uuxoofuixjfqytrdwrui.supabase.co/rest/v1/consultorios?select=id&limit=1
          # chave pública (a mesma que já vai no site); não dá acesso de administrador
          KEY: sb_publishable_DDlOfIuy1NwYnhOxaUkXfw_tkqf782s
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" "$URL" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase respondeu: $status"
          test "$status" = "200"
